<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Wedding Admin</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div id="loginPage">

<div class="loginBox">

<h2>Admin Login</h2>

<input
type="password"
id="password"
placeholder="Masukkan Password">

<button id="loginBtn">
Log Masuk
</button>

</div>

</div>

<div id="dashboard" style="display:none;">

<header>

<h1>Wedding Dashboard</h1>

<button id="logoutBtn">
Log Keluar
</button>

<button id="exportBtn">
📥 Export Excel
</button>

</header>

<section class="cards">

<div class="card">
<h2 id="totalRSVP">0</h2>
<p>Jumlah RSVP</p>
</div>

<div class="card">
<h2 id="totalAttend">0</h2>
<p>Hadir</p>
</div>

<div class="card">
<h2 id="totalAbsent">0</h2>
<p>Tidak Hadir</p>
</div>

<div class="card">
<h2 id="totalGuest">0</h2>
<p>Jumlah Tetamu</p>
</div>

<div class="card">
<h2 id="totalWish">0</h2>
<p>Ucapan</p>
</div>

</section>

<h2 class="title">Senarai RSVP</h2>

<input
type="text"
id="searchRSVP"
placeholder="🔍 Cari nama tetamu..."
class="searchBox">

<div id="rsvpList"></div>

<h2>👥 Senarai Tetamu Hadir</h2>

<input id="searchGuest" class="searchBox" placeholder="🔍 Cari tetamu">

<div id="guestList"></div>

<button id="printGuestBtn">
    🖨 Cetak Senarai
</button>

<h2 class="title">Ucapan</h2>

<input
type="text"
id="searchWish"
placeholder="🔍 Cari nama atau ucapan..."
class="searchBox">

<button id="printWishBtn">
    🖨 Cetak Ucapan
</button>

<div id="wishList"></div>

<script type="module" src="admin.js"></script>

</div>

</body>

</html>
