
<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>By-Sann Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <!-- IMAGE PREVIEW MODAL -->
    <div id="imageModal" class="imageModal">
        <span id="closeImageModal">&times;</span>
        <img id="previewImage" alt="Pratonton gambar">
    </div>

    <!-- EDIT RSVP MODAL -->
    <div id="editModal" class="imageModal">
        <div class="editBox">

            <h2>Edit RSVP</h2>

            <label for="editName">Nama</label>
            <input id="editName" type="text" placeholder="Nama tetamu">

            <label for="editPhone">Telefon</label>
            <input id="editPhone" type="tel" placeholder="Nombor telefon">

            <label for="editAttendance">Kehadiran</label>
            <select id="editAttendance">
                <option value="Hadir">Hadir</option>
                <option value="Tidak Hadir">Tidak Hadir</option>
            </select>

            <label for="editGuest">Bilangan Tetamu</label>
            <input
                id="editGuest"
                type="number"
                min="0"
                placeholder="Bilangan tetamu"
            >

            <div class="modalActions">
                <button id="saveEditBtn" type="button">
                    Simpan
                </button>

                <button id="cancelEditBtn" type="button">
                    Batal
                </button>
            </div>

        </div>
    </div>


    <div class="adminLayout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <h2>By-Sann</h2>
                <small>Admin Panel</small>
            </div>

            <button
                class="menuBtn active"
                type="button"
                data-page="dashboard"
            >
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </button>

            <button
                class="menuBtn"
                type="button"
                data-page="rsvp"
            >
                <i class="fa-solid fa-users"></i>
                RSVP
            </button>

            <button
                class="menuBtn"
                type="button"
                data-page="wishes"
            >
                <i class="fa-solid fa-heart"></i>
                Ucapan
            </button>

            <button
                class="menuBtn"
                type="button"
                data-page="media"
            >
                <i class="fa-solid fa-images"></i>
                Media Manager
            </button>

            <button
                id="logoutBtn"
                class="menuBtn"
                type="button"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="mainContent">

            <h1 id="pageTitle">Dashboard</h1>


            <!-- DASHBOARD -->
            <section
                id="dashboardPage"
                class="pageContent"
            >

                <div class="statsGrid">

                    <div class="statCard">
                        <h3 id="totalRsvp">0</h3>
                        <p>Jumlah RSVP</p>
                    </div>

                    <div class="statCard">
                        <h3 id="totalWish">0</h3>
                        <p>Jumlah Ucapan</p>
                    </div>

                </div>

            </section>


            <!-- RSVP -->
            <section
                id="rsvpPage"
                class="pageContent hidden"
            >

                <h2>RSVP Manager</h2>

                <input
                    type="search"
                    id="searchRsvp"
                    class="searchBox"
                    placeholder="Cari nama atau nombor telefon..."
                >

                <div
                    id="rsvpList"
                    class="listContainer"
                ></div>

            </section>


            <!-- UCAPAN -->
            <section
                id="wishesPage"
                class="pageContent hidden"
            >

                <h2>Ucapan Tetamu</h2>

                <input
                    type="search"
                    id="searchWish"
                    class="searchBox"
                    placeholder="Cari nama atau ucapan..."
                >

                <div
                    id="wishList"
                    class="listContainer"
                ></div>

            </section>


            <!-- MEDIA MANAGER -->
            <section
                id="mediaPage"
                class="pageContent hidden"
            >

                <h2>Media Manager</h2>

                <!-- COVER WEBSITE -->
                <div class="mediaCard">

                    <h3>Upload Cover</h3>

                    <p>
                        Pilih gambar baharu untuk dijadikan
                        cover utama kad jemputan.
                    </p>

                    <label for="coverUpload">
                        Pilih gambar cover
                    </label>

                    <input
                        type="file"
                        id="coverUpload"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <img
                        id="coverPreview"
                        class="coverPreview"
                        alt="Pratonton cover website"
                        hidden
                    >

                    <button
                        type="button"
                        id="uploadCover"
                        class="exportBtn"
                    >
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        Upload Cover
                    </button>

                </div>


                <!-- PAGE IMAGES -->
                <div class="mediaCard">

                    <h3>Page Images</h3>

                    <p>
                        Senarai gambar yang digunakan pada
                        halaman kad jemputan dalam folder
                        GitHub <strong>images</strong>.
                    </p>

                    <div
                        id="pageMediaList"
                        class="mediaGrid"
                    ></div>

                </div>

            </section>

        </main>

    </div>


    <!-- ADMIN JAVASCRIPT -->
    <script type="module" src="admin.js"></script>

</body>
</html>
