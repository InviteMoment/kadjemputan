
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>By-Sann Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="adminLayout">

    <aside class="sidebar">
        <div class="logo">
            <h2>By-Sann</h2>
            <small>Admin Dashboard</small>
        </div>

        <button class="menuBtn active" data-page="dashboard">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </button>

        <button class="menuBtn" data-page="rsvp">
            <i class="fa-solid fa-users"></i> RSVP
        </button>

        <button class="menuBtn" data-page="wishes">
            <i class="fa-solid fa-heart"></i> Ucapan
        </button>

        <button class="menuBtn" data-page="media">
            <i class="fa-solid fa-images"></i> Gambar
        </button>

        <button class="menuBtn" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </aside>

    <main class="mainContent">

        <h1 id="pageTitle">Dashboard</h1>

        <!-- DASHBOARD -->
        <section id="dashboardPage" class="pageContent">
            <div class="statsGrid">

                <div class="statCard">
                    <h3 id="totalRsvp">0</h3>
                    <p>Jumlah RSVP</p>
                </div>

                <div class="statCard">
                    <h3 id="totalGuests">0</h3>
                    <p>Jumlah Tetamu Hadir</p>
                </div>

                <div class="statCard">
                    <h3 id="totalWish">0</h3>
                    <p>Jumlah Ucapan</p>
                </div>

            </div>
        </section>

        <!-- RSVP -->
        <section id="rsvpPage" class="pageContent hidden">
            <h2>Senarai RSVP</h2>

            <input
                type="text"
                id="searchRsvp"
                class="searchBox"
                placeholder="Cari nama atau nombor telefon...">

            <div id="rsvpList" class="listContainer"></div>
        </section>

        <!-- UCAPAN -->
        <section id="wishesPage" class="pageContent hidden">
            <h2>Senarai Ucapan</h2>

            <input
                type="text"
                id="searchWish"
                class="searchBox"
                placeholder="Cari nama atau ucapan...">

            <div id="wishList" class="listContainer"></div>
        </section>

        <!-- GAMBAR GITHUB -->
        <section id="mediaPage" class="pageContent hidden">
            <h2>Gambar Laman Jemputan</h2>

            <p>
                Semua gambar disimpan dalam folder
                <strong>images</strong> di GitHub.
            </p>

            <div id="pageMediaList" class="mediaGrid"></div>
        </section>

    </main>
</div>

<script type="module" src="admin.js"></script>

</body>
</html>
